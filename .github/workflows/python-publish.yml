name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.release.tag_name }}
        fetch-depth: 0

    - name: Verify tag version
      env:
        RELEASE_TAG: ${{ github.event.release.tag_name }}
      run: |
        python - <<'PY'
        import re
        import os
        from pathlib import Path

        tag = os.environ["RELEASE_TAG"]
        if not re.fullmatch(r"v\d+\.\d+\.\d+", tag):
            raise SystemExit(f"Release tag must use vMAJOR.MINOR.PATCH: {tag}")
        expected = tag[1:]
        project = Path("pyproject.toml").read_text(encoding="utf-8")
        setup = Path("setup.py").read_text(encoding="utf-8")
        package = Path("cnpip/__init__.py").read_text(encoding="utf-8")
        if (
            f'version = "{expected}"' not in project
            or f'version="{expected}"' not in setup
            or f'__version__ = "{expected}"' not in package
        ):
            raise SystemExit(f"Package version does not match release tag {tag}")
        PY

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools twine
        pip install build

    - name: Build package
      run: python -m build

    - name: Publish package
      uses: pypa/gh-action-pypi-publish@27b31702a0e7fc50959f5ad993c78deac1bdfc29
      with:
        user: __token__
        password: ${{ secrets.PYPI_API_TOKEN }}
