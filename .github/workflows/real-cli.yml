name: Real CLI integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "cnpip/**"
      - "tests/test_integrations.py"
      - "tests/test_real_cli.py"
      - ".github/workflows/real-cli.yml"
      - "pyproject.toml"
  workflow_dispatch:

jobs:
  real-cli:
    name: Real CLI on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -el {0}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Miniforge
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          auto-activate-base: false

      - name: Install package and real CLI tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" pdm poetry
          pdm --version
          poetry --version
          conda --version

      - name: Run real CLI tests
        env:
          CNPIP_REAL_CLI_TESTS: "1"
        run: pytest -m real_cli tests/test_real_cli.py
