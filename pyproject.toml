[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cnpip"
version = "1.6.0"
authors = [
    { name = "caoergou", email = "mrjingcheng@foxmail.com" },
]
description = "面向中国网络环境的 Python 包管理镜像配置命令行工具，支持 pip、uv、PDM、Poetry 和 Conda。"
readme = "README.md"
requires-python = ">=3.7"
keywords = ["pip", "uv", "pdm", "poetry", "conda", "mirror", "china", "cli"]
dependencies = []
dynamic = ["optional-dependencies"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Installation/Setup",
    "Topic :: Utilities"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
markers = [
    "real_cli: tests that execute real third-party CLI tools in an isolated environment",
]

[tool.ruff]
target-version = "py37"

[tool.pyright]
include = ["cnpip"]
pythonVersion = "3.7"
typeCheckingMode = "basic"

[project.urls]
Homepage = "https://github.com/caoergou/cnpip"
Issues = "https://github.com/caoergou/cnpip/issues"

[project.scripts]
cnpip = "cnpip.cnpip:main"
